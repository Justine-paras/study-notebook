# Windows installer for Study Notebook (npm run dist:win).
appId: com.justineparas.studynotebook
productName: Study Notebook
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
# pdfjs loads its .mjs build, worker, character maps and standard fonts from
# real files at runtime, which is safest outside the asar archive.
asarUnpack:
  - node_modules/pdfjs-dist/**
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Study Notebook
