# Checks every push and pull request on real Windows, then builds the
# installer. The installer is attached to each run as an artifact, so a
# build can be downloaded and installed without setting up Node.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (Electron, demo AI)
        run: npx playwright test

      - name: Build the Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: Study-Notebook-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
